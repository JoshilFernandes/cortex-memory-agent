services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - cortex_data:/app/data

  # Optional real graph database. Not started by a plain `docker compose up`.
  # Start it with: docker compose --profile neo4j up
  # then set GRAPH_BACKEND=neo4j (and NEO4J_URI=bolt://neo4j:7687) in .env
  # before (re)starting the api service so it talks to this container.
  neo4j:
    image: neo4j:5-community
    profiles: ["neo4j"]
    environment:
      NEO4J_AUTH: neo4j/cortex-dev-password
    ports:
      - "7474:7474" # browser UI
      - "7687:7687" # bolt
    volumes:
      - neo4j_data:/data

volumes:
  cortex_data:
  neo4j_data:
