name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite (mock LLM + offline corpus - no API keys needed)
        run: pytest -v

      - name: Run the eval suite report
        run: python -m tests.test_eval_scenarios
